steps:
  # 0. Inicialitza el submodule corpusFJE/skills (font única de les 41 SKILLs).
  #    Sense això, COPY . . al Dockerfile copia el directori del submodule BUIT
  #    → load_skills() retorna 0 → la Call 2 (complements) no genera bastides ni
  #    glossari (bug confirmat 2026-06-02 via log [diag_two_call] skills_carregades=0).
  #    corpusFJE és PRIVAT: el compte de servei de Cloud Build necessita accés de
  #    lectura al repo miquelamor-ai/corpusFJE perquè aquest step funcioni.
  - name: 'gcr.io/cloud-builders/git'
    entrypoint: bash
    secretEnv: ['GITHUB_TOKEN']
    args:
      - -c
      - |
        # Autentica el clone del submodule privat corpusFJE amb el PAT (Secret
        # Manager). Cal fer strip de qualsevol salt de línia del token (el secret
        # es va crear amb un \n final) abans d'usar-lo, sino git config peta amb
        # "invalid key (newline)". Injectem el token a la config insteadOf.
        TOK=$$(printf '%s' "$$GITHUB_TOKEN" | tr -d '\n\r')
        git config --global url."https://x-access-token:$${TOK}@github.com/".insteadOf "https://github.com/"
        git submodule update --init --recursive || echo "WARN: submodule update ha fallat. Skills NO estaran disponibles."
        git config --global --remove-section url."https://x-access-token:$${TOK}@github.com/" 2>/dev/null || true
        N=$$(find corpus/external/corpusFJE/skills -name SKILL.md 2>/dev/null | wc -l)
        echo "=== SKILL.md trobats al build: $$N ==="
        if [ "$$N" -eq "0" ]; then echo "!!! ATENCIO: 0 SKILLs — el submodule no s'ha inicialitzat"; fi

  # 1. Build la imatge Docker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - ${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA
      - .

  # 2. Push a Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - ${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA

  # 3. Deploy a Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA
      - --region=${_DEPLOY_REGION}
      - --platform=${_PLATFORM}
      - --allow-unauthenticated
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --update-env-vars=ATNE_MODEL=gemini-2.5-flash,ATNE_USE_SKILLS=true

images:
  - ${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA

availableSecrets:
  secretManager:
    - versionName: projects/dreseraios-drive/secrets/github-corpusfje-token/versions/latest
      env: 'GITHUB_TOKEN'

options:
  logging: CLOUD_LOGGING_ONLY

