# =============================================================================
# tests/golden/cases.yaml — Casos golden (versió ATNE-fidel)
# =============================================================================
# Font canònica: els perfils demo que es veuen al Pas 1 de ATNE.
# Sincronitza amb: ui/atne/pas1.html:961-1005 (window.ATNE_PROFILES).
#
# Principi: el harness valida exactament els perfils que el docent veu al
# selector del Pas 1. Si afegeixes un perfil demo nou a ATNE, copia'l aquí
# i el harness el validarà.
#
# 11 perfils (4 principals + 4 demo persones + 3 grups). MECR derivat del
# curs segons COURSE_TO_MECR (profile-canonical.js). DUA i gènere fixats al
# text demo (Rev. Industrial → divulgatiu històric, ESO 4).
#
# Per cada cas el harness valida:
#   (1) Skills actives = expected_skills (semàntica de triggers)
#   (2) Defaults UI alineats amb matrix.yaml (canon)
#   (3) instruction_filter.get_instructions() no peta
# =============================================================================

