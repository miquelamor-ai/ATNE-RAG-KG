# =============================================================================
# tests/golden/cases.yaml — Casos golden Fase A
# =============================================================================
# 15 casos representatius (1 per condició × 12 + 3 compostos multi-condició).
# Cada cas és un "perfil canònic" amb el que ha de funcionar el sistema.
#
# Per cada cas el harness valida:
#   (1) Skills actives = expected_skills (semàntica de triggers)
#   (2) Complements per defecte = matrix.yaml (alineació codi vs canon)
#   (3) Instruction_filter no peta i activa macrodirectives plausibles
#
# Si afegeixes un cas, també afegeix una secció `expected_skills` mínima per
# justificar què hi esperaves trobar. La primera execució te'l dirà si erres.
# =============================================================================

meta:
  versio: "1.0.0"
  generat_at: "2026-05-26"
  total_casos: 15

