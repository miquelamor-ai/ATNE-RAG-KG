# =============================================================================
# tests/golden/golden_texts.yaml — Textos font per a la Fase B
# =============================================================================
# Font canònica: els textos demo precarregats al frontend ATNE.
# Sincronitza amb: ui/atne/pas2-standalone.html (textarea#write-ta).
#
# Principi: el harness valida exactament el que el docent veu a l'aplicació.
# Si afegeixes un text demo nou al Pas 2 de ATNE, copia'l aquí. Si elimines
# un text de ATNE, elimina'l aquí.
#
# NOTA (2026-05-27): ara mateix ATNE només precarrega 1 text demo (Rev.
# Industrial, 52 paraules). Per a la Fase B rigorosa caldria ampliar el
# catàleg d'exemples al Pas 2 de ATNE. Quan ho fem, aquí afegirem els nous.
# =============================================================================

textos:

  revolucio_industrial_demo:
    descripcio: "Text demo precarregat a pas2-standalone.html (Matèria: Història · ESO 4)"
    font_atne: "ui/atne/pas2-standalone.html:1151 (textarea#write-ta)"
    paraules_aprox: 52
    materia: "història"
    nivell_origen: "ESO 4"
    registre: "expositiu-divulgatiu"
    text: |
      La Revolució Industrial és el període de transformació profunda de les formes de producció que va començar al Regne Unit cap al 1760 i es va estendre per Europa i Amèrica del Nord durant el segle XIX. Aquest canvi va suposar la transició d'una economia agrària a una industrial, amb l'aparició de les primeres fàbriques i de la màquina de vapor.
